apply plugin: 'com.android.application'

// Release signing. The keystore itself never lives in the repo — its path and
// passwords come from android/keystore.properties (gitignored) or, for CI, the
// matching POLON_* environment variables. When neither resolves, the signing
// config is simply not attached, so a fresh clone still builds; only a release
// build is affected, and the check task below makes that loud rather than
// silently shipping an unsigned artifact.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingProp = { String key, String env -> keystoreProps.getProperty(key) ?: System.getenv(env) }
def storeFilePath = signingProp("storeFile", "POLON_KEYSTORE_FILE")
def releaseKeystore = storeFilePath == null ? null : rootProject.file(storeFilePath)
def hasReleaseSigning = releaseKeystore != null && releaseKeystore.exists()

android {
    namespace = "com.polon.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.polon.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseKeystore
                storePassword signingProp("storePassword", "POLON_KEYSTORE_PASSWORD")
                keyAlias signingProp("keyAlias", "POLON_KEY_ALIAS")
                keyPassword signingProp("keyPassword", "POLON_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Fail loudly instead of producing a release artifact Play will reject. Without
// this an unconfigured machine yields an unsigned APK/AAB that only fails at
// upload time, long after the build looks like it succeeded.
tasks.configureEach { task ->
    if (task.name in ["assembleRelease", "bundleRelease"] && !hasReleaseSigning) {
        task.doFirst {
            throw new GradleException(
                "No release signing key configured. Create android/keystore.properties " +
                "(see keystore.properties.example) or set POLON_KEYSTORE_FILE, " +
                "POLON_KEYSTORE_PASSWORD, POLON_KEY_ALIAS and POLON_KEY_PASSWORD.")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
