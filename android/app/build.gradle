import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

// Release signing. The keystore itself never lives in the repo — its path and
// passwords come from android/keystore.properties (gitignored) or, for CI, the
// matching POLUCZ_* environment variables. When neither resolves, the signing
// config is simply not attached, so a fresh clone still builds; only a release
// build is affected, and the check task below makes that loud rather than
// silently shipping an unsigned artifact.
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def signingProp = { String key, String env -> keystoreProps.getProperty(key) ?: System.getenv(env) }
def storeFilePath = signingProp("storeFile", "POLUCZ_KEYSTORE_FILE")
def releaseKeystore = storeFilePath == null ? null : rootProject.file(storeFilePath)
def hasReleaseSigning = releaseKeystore != null && releaseKeystore.exists()

// Version comes from package.json, so the web build and the APK can never
// disagree about what release this is. Bump it with `npm version patch|minor|major`.
//
// versionCode is DERIVED rather than tracked separately: Play only requires it
// to increase, and deriving it from semver makes that automatic. Deliberately
// not the git commit count — this repo's history has already been rewritten
// once, which would have sent the count backwards and locked out every future
// upload.
def pkg = new JsonSlurper().parse(rootProject.file("../package.json"))
def semver = pkg.version.tokenize('.').collect { it.toInteger() }
if (semver.size() != 3 || semver[1] > 99 || semver[2] > 99) {
    throw new GradleException(
        "package.json version '${pkg.version}' does not fit the versionCode scheme " +
        "(major.minor.patch, minor and patch <= 99).")
}
def appVersionName = pkg.version
def appVersionCode = semver[0] * 10000 + semver[1] * 100 + semver[2]

android {
    namespace = "com.polucz.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.polucz.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseKeystore
                storePassword signingProp("storePassword", "POLUCZ_KEYSTORE_PASSWORD")
                keyAlias signingProp("keyAlias", "POLUCZ_KEY_ALIAS")
                keyPassword signingProp("keyPassword", "POLUCZ_KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// Fail loudly instead of producing a release artifact Play will reject. Without
// this an unconfigured machine yields an unsigned APK/AAB that only fails at
// upload time, long after the build looks like it succeeded.
tasks.configureEach { task ->
    if (task.name in ["assembleRelease", "bundleRelease"] && !hasReleaseSigning) {
        task.doFirst {
            throw new GradleException(
                "No release signing key configured. Create android/keystore.properties " +
                "(see keystore.properties.example) or set POLUCZ_KEYSTORE_FILE, " +
                "POLUCZ_KEYSTORE_PASSWORD, POLUCZ_KEY_ALIAS and POLUCZ_KEY_PASSWORD.")
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
