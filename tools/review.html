<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polucz — Sentence Review</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }

  body {
    background: #0a0a12;
    color: #f8fafc;
    font-family: 'Georgia', serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 80px;
  }

  h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.06em;
    color: rgba(248,250,252,0.4);
    text-transform: uppercase;
    margin-bottom: 40px;
  }

  /* ── Load screen ─────────────────────────────────────────── */
  #load-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
    padding-top: 60px;
  }

  #load-screen p {
    font-size: 16px;
    color: rgba(248,250,252,0.5);
    text-align: center;
    max-width: 380px;
    line-height: 1.6;
  }

  label.file-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    border-radius: 32px;
    border: 1px solid rgba(180,160,255,0.3);
    background: rgba(180,160,255,0.08);
    color: #b4a0ff;
    font-size: 16px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }
  label.file-btn:hover { background: rgba(180,160,255,0.16); border-color: rgba(180,160,255,0.5) }
  #file-input { display: none }

  /* ── Progress bar ────────────────────────────────────────── */
  #progress-wrap {
    width: 100%;
    max-width: 560px;
    margin-bottom: 32px;
  }
  #progress-bar-bg {
    height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  #progress-bar-fill {
    height: 100%;
    background: #b4a0ff;
    border-radius: 4px;
    transition: width 0.3s ease;
  }
  #progress-label {
    text-align: right;
    font-size: 13px;
    color: rgba(248,250,252,0.3);
    font-family: 'Courier New', monospace;
  }

  /* ── Card ────────────────────────────────────────────────── */
  #card {
    width: 100%;
    max-width: 560px;
    border-radius: 28px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03);
    backdrop-filter: blur(16px);
    padding: 36px 40px;
    display: flex;
    flex-direction: column;
    gap: 20px;
    box-shadow: 0 16px 48px rgba(0,0,0,0.5);
  }

  /* type badge */
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 4px 14px;
    border-radius: 32px;
    border: 1px solid rgba(248,250,252,0.15);
    background: rgba(248,250,252,0.07);
    font-size: 11px;
    font-family: 'Courier New', monospace;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: rgba(248,250,252,0.6);
    align-self: flex-start;
  }
  .badge.verb      { border-color: rgba(140,63,160,0.4);  background: rgba(140,63,160,0.1);  color: #d4a0ff }
  .badge.noun      { border-color: rgba(192,104,32,0.4);  background: rgba(192,104,32,0.1);  color: #f0c080 }
  .badge.adjective { border-color: rgba(26,138,48,0.4);   background: rgba(26,138,48,0.1);   color: #80e0a0 }

  /* grammatical label */
  .gram-label {
    font-size: 13px;
    color: rgba(248,250,252,0.35);
    font-family: 'Courier New', monospace;
    letter-spacing: 0.03em;
  }

  /* Polish sentence with highlight */
  .polish-sentence {
    font-size: 26px;
    line-height: 1.45;
    color: #f8fafc;
    letter-spacing: -0.01em;
  }
  .polish-sentence mark {
    background: rgba(180,160,255,0.25);
    color: #c8b4ff;
    border-radius: 4px;
    padding: 1px 3px;
  }

  /* divider */
  .divider {
    height: 1px;
    background: rgba(255,255,255,0.08);
  }

  /* English translation */
  .english {
    font-size: 17px;
    color: rgba(248,250,252,0.5);
    font-style: italic;
    line-height: 1.5;
  }

  /* ── Action buttons ──────────────────────────────────────── */
  #actions {
    display: flex;
    gap: 12px;
    width: 100%;
    max-width: 560px;
    margin-top: 20px;
  }

  button.action {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px;
    border-radius: 24px;
    border: 1px solid;
    font-size: 16px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.12s, transform 0.1s;
  }
  button.action:active { transform: scale(0.97) }

  #btn-reject {
    border-color: rgba(248,113,113,0.25);
    background: rgba(248,113,113,0.07);
    color: rgba(248,113,113,0.7);
  }
  #btn-reject:hover { background: rgba(248,113,113,0.15) }

  #btn-approve {
    border-color: rgba(134,239,172,0.25);
    background: rgba(134,239,172,0.07);
    color: rgba(134,239,172,0.8);
  }
  #btn-approve:hover { background: rgba(134,239,172,0.15) }

  /* keyboard hint */
  .key-hint {
    font-size: 11px;
    opacity: 0.5;
    font-family: 'Courier New', monospace;
    background: rgba(255,255,255,0.08);
    padding: 2px 6px;
    border-radius: 4px;
  }

  /* ── Done screen ─────────────────────────────────────────── */
  #done-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    padding-top: 40px;
    text-align: center;
  }
  #done-screen h2 { font-size: 28px; color: #b4a0ff }
  #done-screen p  { font-size: 16px; color: rgba(248,250,252,0.5); line-height: 1.6 }

  button.export-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 16px 32px;
    border-radius: 32px;
    border: 1px solid rgba(134,239,172,0.3);
    background: rgba(134,239,172,0.08);
    color: rgba(134,239,172,0.9);
    font-size: 16px;
    font-family: inherit;
    cursor: pointer;
    transition: background 0.15s;
  }
  button.export-btn:hover { background: rgba(134,239,172,0.16) }

  #review-area { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 0 }
</style>
</head>
<body>

<h1>Sentence Review</h1>

<!-- Load screen -->
<div id="load-screen">
  <p>Load the report from <code>npm run curate</code></p>
  <p style="font-size:13px;opacity:.5">polucz-flagged-YYYY-MM-DD.json, in Downloads</p>
  <input type="file" id="file-input" accept=".json,application/json">
</div>

<div id="review-area" style="display:none">
  <div id="progress-wrap">
    <div id="progress-bar-bg"><div id="progress-bar-fill" style="width:0%"></div></div>
    <div id="progress-label">0 / 0</div>
  </div>

  <div id="card">
    <div class="badge" id="badge"></div>
    <div class="gram-label" id="gram-label"></div>
    <div class="polish-sentence" id="polish"></div>
    <div class="english" id="english"></div>
    <div id="issues" style="margin-top:18px;font-size:13px;line-height:1.7;opacity:.75"></div>
  </div>

  <div id="actions">
    <button class="action" id="btn-reject">&#10007; Drop</button>
    <button class="action" id="btn-approve">&#10003; Keep</button>
  </div>
  <p style="margin-top:18px;font-size:12px;opacity:.4">
    Dropping removes the question. Its slot falls back to the card's own paradigm,
    and any tier can fill it again later.
  </p>
</div>

<div id="done-screen">
  <h2 style="font-size:20px;margin-bottom:12px">Done</h2>
  <p id="done-summary"></p>
  <button class="export-btn" id="btn-export">&#8659; Save curated backup</button>
</div>

<script>
// Reviews only what LanguageTool flagged — see docs/tiered-quiz-generation-plan.md §8.
// Everything it did not flag is kept untouched, which is the point: the desktop
// pass exists to surface a minority, not to re-review the whole set.
let report = null      // { backup, flagged }
let queue = []
let cursor = 0
const dropped = new Set()

const $ = id => document.getElementById(id)

$('file-input').addEventListener('change', e => {
  const file = e.target.files[0]
  if (!file) return
  const reader = new FileReader()
  reader.onload = ev => {
    try {
      report = JSON.parse(ev.target.result)
      if (!report.backup || !Array.isArray(report.flagged)) throw new Error('shape')
      queue = report.flagged
      if (queue.length === 0) { finish(); return }
      $('load-screen').style.display = 'none'
      $('review-area').style.display = 'flex'
      render()
    } catch {
      alert('That is not a curate report. Run: npm run curate')
    }
  }
  reader.readAsText(file)
})

/** Marks the flagged spans inside the sentence so the eye goes straight to them. */
function highlight(text, issues) {
  const sorted = [...issues].sort((a, b) => a.offset - b.offset)
  let out = '', at = 0
  const esc = t => t.replace(/&/g, '&amp;').replace(/</g, '&lt;')
  for (const i of sorted) {
    if (i.offset < at) continue           // overlapping matches: keep the first
    out += esc(text.slice(at, i.offset))
    out += '<span style="background:rgba(255,120,120,.25);border-bottom:2px solid rgba(255,120,120,.7)">'
        +  esc(text.substr(i.offset, i.length)) + '</span>'
    at = i.offset + i.length
  }
  return out + esc(text.slice(at))
}

function render() {
  const s = queue[cursor]
  $('progress-bar-fill').style.width = (100 * cursor / queue.length) + '%'
  $('progress-label').textContent = (cursor + 1) + ' / ' + queue.length
  $('badge').textContent = s.source
  $('gram-label').textContent = s.form + ' — ' + s.lemma
  $('polish').innerHTML = highlight(s.polish, s.issues)
  $('english').textContent = s.english || ''
  $('issues').innerHTML = s.issues
    .map(i => '• ' + i.message.replace(/</g, '&lt;') + (i.rule ? ' <span style="opacity:.4">(' + i.rule + ')</span>' : ''))
    .join('<br>')
}

function advance() {
  cursor++
  if (cursor >= queue.length) finish(); else render()
}

$('btn-approve').addEventListener('click', advance)
$('btn-reject').addEventListener('click', () => { dropped.add(queue[cursor].id); advance() })
document.addEventListener('keydown', e => {
  if ($('review-area').style.display === 'none') return
  if (e.key === 'ArrowRight' || e.key === 'k') $('btn-approve').click()
  if (e.key === 'ArrowLeft'  || e.key === 'j') $('btn-reject').click()
})

function finish() {
  $('load-screen').style.display = 'none'
  $('review-area').style.display = 'none'
  $('done-screen').style.display = 'flex'
  const kept = queue.length - dropped.size
  $('done-summary').innerHTML = queue.length === 0
    ? 'Nothing was flagged. The backup is unchanged.'
    : 'Kept <strong>' + kept + '</strong>, dropped <strong>' + dropped.size + '</strong> of '
      + queue.length + ' flagged.<br>Everything not flagged is untouched.'
}

$('btn-export').addEventListener('click', () => {
  // A COMPLETE backup, not a diff: the app's import replaces cards, reviews and
  // sentences with whatever it is given, so a sentences-only file would wipe the
  // vocabulary on the way back in.
  const out = {
    ...report.backup,
    sentences: report.backup.sentences.filter(s => !dropped.has(s.id)),
  }
  const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' })
  const a = document.createElement('a')
  a.href = URL.createObjectURL(blob)
  a.download = 'polucz-curated-' + new Date().toISOString().slice(0, 10) + '.json'
  a.click()
  URL.revokeObjectURL(a.href)
})
</script>
</body>
</html>
